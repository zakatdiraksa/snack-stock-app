<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack Stock - Toko Snack Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🍿 Snack Stock Store</h1>
            <p>Jajanan Lezat Pilihan</p>
        </header>

        <!-- Navigation Mode -->
        <nav class="mode-selector">
            <button id="customerMode" class="mode-btn active">👤 Mode Customer</button>
            <button id="adminMode" class="mode-btn">🔐 Mode Admin</button>
        </nav>

        <!-- Admin Login Panel -->
        <div id="adminPanel" class="admin-panel hidden">
            <div class="login-box">
                <h2>Login Admin</h2>
                <input type="password" id="adminPassword" placeholder="Masukkan Password Admin" />
                <button onclick="loginAdmin()">Login</button>
                <p id="adminError" class="error-msg"></p>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" class="admin-dashboard hidden">
            <div class="admin-header">
                <h2>📊 Admin Dashboard</h2>
                <button onclick="logoutAdmin()" class="logout-btn">Logout</button>
            </div>

            <!-- Add Product Form -->
            <div class="form-section">
                <h3>➕ Tambah Produk Baru</h3>
                <div class="form-group">
                    <input type="text" id="productName" placeholder="Nama Produk" />
                    
                    <!-- File Upload untuk Foto -->
                    <div class="file-upload-container">
                        <label for="productPhoto" class="file-upload-label">
                            📷 Pilih Foto Produk
                        </label>
                        <input type="file" id="productPhoto" accept="image/*" capture="environment" />
                        <div id="photoPreview" class="photo-preview hidden">
                            <img id="previewImage" src="" alt="Preview" />
                            <button type="button" onclick="clearPhotoPreview()" class="btn-clear">❌ Hapus Foto</button>
                        </div>
                    </div>
                    
                    <input type="number" id="productPrice" placeholder="Harga" />
                    <input type="text" id="priceUnit" placeholder="Satuan (kg/pcs/bungkus)" />
                    <input type="number" id="productStock" placeholder="Jumlah Stock" />
                    <button onclick="addProduct()" class="btn-primary">Tambah Produk</button>
                </div>
            </div>

            <!-- Products Management -->
            <div class="form-section">
                <h3>📦 Kelola Produk</h3>
                <div id="adminProductList" class="admin-product-list"></div>
            </div>

            <!-- Orders Management -->
            <div class="form-section">
                <h3>📋 Daftar Pesanan</h3>
                <div id="ordersList" class="orders-list"></div>
            </div>

            <!-- WhatsApp Admin Contact -->
            <div class="form-section">
                <h3>📱 Pengaturan WhatsApp Admin</h3>
                <div class="form-group">
                    <input type="text" id="adminWhatsapp" placeholder="Nomor WhatsApp (62XXXXXXXXXX)" />
                    <button onclick="saveAdminWhatsapp()" class="btn-primary">Simpan Nomor</button>
                    <p id="whatsappStatus" class="success-msg"></p>
                </div>
            </div>
        </div>

        <!-- Customer View -->
        <div id="customerView" class="customer-view">
            <div class="customer-header">
                <h2>Katalog Produk</h2>
                <button id="shareLink" class="share-btn" onclick="generateShareLink()">🔗 Bagikan Link</button>
            </div>

            <!-- Products Grid -->
            <div id="productsList" class="products-grid"></div>

            <!-- Cart Summary -->
            <div id="cartSummary" class="cart-summary hidden">
                <h3>Ringkasan Pesanan</h3>
                <div id="cartItems" class="cart-items"></div>
                <div class="cart-total">
                    <strong>Total: Rp <span id="totalPrice">0</span></strong>
                </div>
                <button onclick="openOrderForm()" class="btn-primary">Lanjut Pesan</button>
            </div>
        </div>

        <!-- Order Form Modal -->
        <div id="orderModal" class="modal hidden">
            <div class="modal-content">
                <span class="close" onclick="closeOrderForm()">&times;</span>
                <h2>📝 Form Pesanan</h2>
                <div class="form-group">
                    <input type="text" id="customerName" placeholder="Nama Lengkap" />
                    <input type="text" id="customerPhone" placeholder="Nomor Telepon" />
                    <input type="text" id="customerAddress" placeholder="Alamat Pengiriman" />
                </div>
                <div id="orderSummary" class="order-summary"></div>
                <button onclick="sendToWhatsapp()" class="btn-primary">Kirim ke WhatsApp</button>
            </div>
        </div>

        <!-- Share Link Display Modal -->
        <div id="shareLinkModal" class="modal hidden">
            <div class="modal-content">
                <span class="close" onclick="closeShareLink()">&times;</span>
                <h2>🔗 Link untuk Dibagikan</h2>
                <p>Bagikan link ini kepada customer:</p>
                <div class="link-box">
                    <input type="text" id="shareLinkInput" readonly />
                    <button onclick="copyToClipboard()" class="btn-primary">Copy Link</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
